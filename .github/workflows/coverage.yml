name: Build, Test and Local Coverage Report

on:
  push:
    branches: [ Master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore FoodOrder.Pedidos/FoodOrder.Pedidos.sln

      - name: 🧱 Build
        run: dotnet build FoodOrder.Pedidos/FoodOrder.Pedidos.sln --configuration Release --no-restore

      - name: 🧪 Run tests and collect coverage
        run: |
          dotnet test FoodOrder.Pedidos/FoodOrder.Pedidos.Tests/FoodOrder.Pedidos.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage"

      - name: 📦 Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: 🗂 Generate HTML report
        run: |
          REPORT_PATH=$(find . -type f -name 'coverage.cobertura.xml' | head -n 1)
          reportgenerator \
            -reports:$REPORT_PATH \
            -targetdir:coverage-report \
            -reporttypes:Html

      - name: 📎 Upload coverage report as artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage-report
