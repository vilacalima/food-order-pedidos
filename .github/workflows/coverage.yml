name: Build, Test and Coverage

on:
  push:
    branches: [ Master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore FoodOrder.Pedidos/FoodOrder.Pedidos.sln

      - name: 🧱 Build
        run: dotnet build FoodOrder.Pedidos/FoodOrder.Pedidos.sln --configuration Release --no-restore

      - name: 📁 Create test-results folder
        run: mkdir -p test-results

      - name: 🧪 Run tests with coverage and junit report
        run: |
          dotnet test FoodOrder.Pedidos/FoodOrder.Pedidos.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger:"junit;LogFilePath=test-results/junit.xml"

      - name: 🔍 Verificar arquivos gerados
        run: |
          find . -name "*.coverage"
          find . -name "*.xml"
          ls -la test-results

      - name: 📡 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: 📡 Upload test results (JUnit) to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/junit.xml
