name: Build, Test and Coverage

on:
  push:
    branches: [ Master ] # Verifique se é Master ou main (minúsculo)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore FoodOrder.Pedidos/FoodOrder.Pedidos.sln

      - name: 🧱 Build
        run: dotnet build FoodOrder.Pedidos/FoodOrder.Pedidos.sln --configuration Release --no-restore

      - name: 📦 Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: 🔧 Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: 🧪 Run tests with coverage
        run: |
          dotnet test FoodOrder.Pedidos/FoodOrder.Pedidos.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage"

      - name: 🔍 List coverage files
        run: |
          find . -name "*.coverage"
          find . -name "*.xml"

      - name: 📁 Generate HTML coverage report
        run: |
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:Html

      - name: 💾 Save coverage report artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage-report

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Master' # Confirme o nome da branch

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔄 Restore coverage output from previous job
        uses: actions/download-artifact@v3
        with:
          name: coverage-report
          path: coverage-report

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage-report
