name: Test and Report Coverage

on:
  push:
    branches:
      - Master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: 📦 Restore dependencies
        run: dotnet restore FoodOrder.Pedidos/FoodOrder.Pedidos.sln

      - name: 🧱 Build do projeto
        run: dotnet build FoodOrder.Pedidos/FoodOrder.Pedidos.sln --no-restore --configuration Release

      - name: 📂 Create coverage output directory
        run: mkdir -p ./Tests/Coverage

      - name: 🧪 Run tests and collect coverage (OpenCover format)
        run: |
          dotnet test FoodOrder.Pedidos/FoodOrder.Pedidos.sln \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./Tests/Coverage/coverage.opencover.xml \
            /p:CoverletOutputFormat=opencover

      - name: 📂 List coverage directory
        run: ls -la ./Tests/Coverage

      - name: 📊 Install ReportGenerator tool
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.10
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: 📊 Generate HTML coverage report
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          reportgenerator \
            -reports:"./Tests/Coverage/coverage.opencover.xml" \
            -targetdir:"./Tests/Coverage/Report" \
            -reporttypes:Html

      - name: 🛠️ Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: 📈 Extract coverage percentage
        id: coverage
        run: |
          total_line_rate=$(xmllint --xpath "string(//coverage/@line-rate)" ./Tests/Coverage/coverage.opencover.xml)
          coverage_percent=$(awk "BEGIN { printf \"%.2f\", ${total_line_rate} * 100 }")
          echo "Coverage percent: $coverage_percent%"
          echo "coverage=$coverage_percent" >> $GITHUB_OUTPUT
          echo "coverage_percent=$coverage_percent" >> $GITHUB_ENV

      - name: ✏️ Update coverage badge in README.md
        run: |
          sed -i -E "s|!\[Cobertura\]\(https://img.shields.io/badge/Cobertura-[0-9]+(\.[0-9]+)?%25-brightgreen\)|![Cobertura](https://img.shields.io/badge/Cobertura-${{ env.coverage_percent }}%25-brightgreen)|g" README.md

      - name: 💾 Commit and push README update
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza badge de cobertura para ${{ env.coverage_percent }}%"
            git push
          else
            echo "No changes in README.md"
          fi

      - name: 🚀 Upload coverage to Coveralls via npx
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          npx coveralls < ./Tests/Coverage/coverage.opencover.xml
