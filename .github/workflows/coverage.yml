name: Build, Test and Coverage

on:
  push:
    branches: [ Master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore FoodOrder.Pedidos/FoodOrder.Pedidos.sln

      - name: 🧱 Build
        run: dotnet build FoodOrder.Pedidos/FoodOrder.Pedidos.sln --configuration Release --no-restore

      - name: 🧪 Run tests with coverage
        run: |
          dotnet test FoodOrder.Pedidos/FoodOrder.Pedidos.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage"

      - name: 🔍 List coverage files
        run: |
          find . -name "*.coverage"
          find . -name "*.xml"

      - name: 📡 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: true
