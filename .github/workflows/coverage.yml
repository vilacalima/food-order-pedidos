name: Build, Test and Coverage

on:
  push:
    branches: [ Master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore FoodOrder.Pedidos/FoodOrder.Pedidos.sln

      - name: 🧱 Build
        run: dotnet build FoodOrder.Pedidos/FoodOrder.Pedidos.sln --configuration Release --no-restore

      - name: 🧪 Run tests with coverage
        run: |
          dotnet test FoodOrder.Pedidos/FoodOrder.Pedidos.sln \
            --configuration Release \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage.cobertura.xml

      - name: 🔍 Verify coverage file exists
        run: |
          ls -la coverage.cobertura.xml
          echo "First 20 lines of coverage file:"
          head -n 20 coverage.cobertura.xml

      - name: 📡 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: 'coverage.cobertura.xml'
          fail_ci_if_error: true
          verbose: true
