name: Test and Report Coverage

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: dotnet restore FoodOrder.Pedidos/FoodOrder.Pedidos.sln

      - name: Build
        run: dotnet build FoodOrder.Pedidos/FoodOrder.Pedidos.sln --no-restore

      - name: Run tests and collect coverage
        run: |
          dotnet test FoodOrder.Pedidos/FoodOrder.Pedidos.sln \
            --no-build \
            --collect:"XPlat Code Coverage" \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=./coverage/ \
            -p:ExcludeByFile="**/*Migrations/*.cs"

      - name: Generate HTML Report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./coverage/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:Html

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: ./coverage/report

      - name: Fetch all history for Coveralls
        run: git fetch --unshallow || true

      - name: Set up Git for Coveralls
        run: git config --global --add safe.directory $(pwd)

      - name: Install and run Coveralls
        run: |
          dotnet tool install --global coveralls.net
          export PATH="$HOME/.dotnet/tools:$PATH"

          csmacnz.Coveralls \
            --useRelativePaths \
            --opencover \
            -i ./coverage/coverage.cobertura.xml \
            --repoToken "${{ secrets.COVERALLS_REPO_TOKEN }}" \
            --commitId "${{ github.sha }}" \
            --commitBranch "${{ github.ref_name }}" \
            --serviceName "github" \
            --jobId "${{ github.run_id }}" \
            --basePath $(pwd)
