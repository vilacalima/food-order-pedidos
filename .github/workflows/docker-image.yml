name: Build and Push Docker Image

on:
  push:
    branches:
      - Master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Debug secrets
        run: |
          echo "DOCKER_USERNAME existe? ${{ secrets.DOCKER_USERNAME != '' }}"
          echo "DOCKER_PASSWORD existe? ${{ secrets.DOCKER_PASSWORD != '' }}"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da imagem Docker (com Dockerfile customizado)
        run: docker build -f FoodOrder.Pedidos/Dockerfile -t vilacaro/pedido:latest .

      - name: Push da imagem para o Docker Hub
        run: docker push vilacaro/pedido:latest
